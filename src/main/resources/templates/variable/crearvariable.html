<!doctype html>
<html lang="es"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillauli}">
<head>
	<meta charset="UTF-8">
	<title>Nueva variable</title>
</head>
<body>
	<h3 layout:fragment="titulo">Nueva variable</h3>

	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
		<li class="breadcrumb-item"><a th:href="@{/variables}">Variables</a></li>
		<li class="breadcrumb-item active">Nueva</li>
	</ol>

	<div layout:fragment="contenidopaginas">
		<form th:action="@{/variables/guardar}"
			th:object="${variable}"
			method="post">

			<div class="card content-card">
				<div class="card-header">
					<h5 class="card-title mb-0">Registrar variable</h5>
				</div>

				<div class="card-body">
					<div class="row g-3">

						<div class="col-md-6">
							<label for="idEnsayo" class="form-label">Ensayo</label>
							<select id="idEnsayo"
								class="form-select"
								th:field="*{idEnsayo}"
								required>
								<option value="">Seleccione un ensayo</option>
								<option th:each="ensayo : ${ensayos}"
									th:value="${ensayo.idEnsayo}"
									th:text="${ensayo.codigoEnsayo}">
								</option>
							</select>
						</div>

						<div class="col-md-6">
							<label for="nombreVariable" class="form-label">Nombre de variable</label>
							<input type="text"
								id="nombreVariable"
								class="form-control"
								th:field="*{nombreVariable}"
								placeholder="Ejemplo: pH"
								maxlength="100"
								required>
						</div>

						<div class="col-md-6">
							<label for="valorObtenido" class="form-label">Valor obtenido</label>
							<input type="number"
								id="valorObtenido"
								class="form-control"
								th:field="*{valorObtenido}"
								step="0.0001"
								placeholder="0.0000"
								required>
						</div>

						<div class="col-md-6">
							<label for="unidadMedida" class="form-label">Unidad de medida</label>
							<input type="text"
								id="unidadMedida"
								class="form-control"
								th:field="*{unidadMedida}"
								placeholder="Ejemplo: °C, %, mg/L"
								maxlength="50"
								required>
						</div>
					</div>
				</div>

				<div class="card-footer d-flex justify-content-end gap-2">
					<a th:href="@{/variables}" class="btn btn-outline-secondary">
						<i class="bi bi-x-circle me-1"></i>Cancelar
					</a>
					<button type="submit" class="btn btn-primary">
						<i class="bi bi-save me-1"></i>Guardar variable
					</button>
				</div>
			</div>
		</form>
	</div>

	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
