<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pisip-JBpharmaWeb | Cambiar Contraseña</title>

<!-- Google Fonts -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" />
<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
<!-- AdminLTE CSS -->
<link rel="stylesheet" href="../css/adminlte.css" />

<!-- ESTILOS UNIFICADOS -->
<style>
body.login-page {
	background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
}

.login-box {
	width: 100%;
	max-width: 420px;
	padding: 15px;
}

.login-logo a {
	font-size: 1.8rem;
	font-weight: 700;
	color: #1e293b;
	text-decoration: none;
	letter-spacing: -0.5px;
}

.login-logo span {
	color: #0d6efd;
}

.card-custom {
	border: none;
	border-radius: 1rem;
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
	background: #ffffff;
	overflow: hidden;
}

.card-body-custom {
	padding: 2.5rem 2rem;
}

.form-control {
	border-top-left-radius: 0.5rem;
	border-bottom-left-radius: 0.5rem;
	padding: 0.75rem 1rem;
	border-color: #dee2e6;
}

.form-control:focus {
	box-shadow: none;
	border-color: #198754;
}

.input-group-text {
	border-top-right-radius: 0.5rem;
	border-bottom-right-radius: 0.5rem;
	background-color: #f8f9fa;
	color: #6c757d;
	border-color: #dee2e6;
	padding-left: 1rem;
	padding-right: 1rem;
}

.btn-success-custom {
	border-radius: 0.5rem;
	padding: 0.75rem;
	font-weight: 600;
	font-size: 1rem;
	background-color: #198754;
	border: none;
	transition: all 0.2s ease-in-out;
}

.btn-success-custom:hover {
	background-color: #157347;
	transform: translateY(-1px);
	box-shadow: 0 4px 12px rgba(25, 135, 84, 0.25);
}

.back-link {
	color: #6c757d;
	text-decoration: none;
	font-size: 0.9rem;
	transition: color 0.2s;
}

.back-link:hover {
	color: #dc3545;
	text-decoration: underline;
}
</style>
</head>

<body class="login-page">
	<main class="login-box">

		<!-- LOGO -->
		<div class="login-logo text-center mb-4">
			<a href="#"><span>Pisip</span>-JBpharmaWeb</a>
		</div>

		<!-- TARJETA -->
		<div class="card card-custom">
			<div class="card-body card-body-custom">

				<div class="text-center mb-4">
					<h5 class="fw-bold text-dark mb-1">Primer Inicio de Sesión</h5>
					<p class="text-muted small">Por razones de seguridad, debes
						actualizar tu contraseña antes de continuar.</p>
				</div>

				<!-- FORMULARIO -->
				<form th:action="@{/autenticacion/guardar-primer-cambio}"
					method="post">
					<div class="mb-4">
						<label for="newPassword"
							class="form-label small text-muted fw-semibold mb-1">Nueva
							Contraseña</label>
						<div class="input-group">
							<input id="newPassword" type="password" class="form-control"
								placeholder="••••••••" name="nuevaContrasena" required /> <span
								class="input-group-text"><i class="bi bi-lock-fill"></i></span>
						</div>
					</div>

					<div class="d-grid mb-3">
						<button type="submit" class="btn btn-success btn-success-custom">
							Actualizar Contraseña <i class="bi bi-check-circle-fill ms-2"></i>
						</button>
					</div>
				</form>
			</div>
		</div>

	</main>

	<!-- JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		crossorigin="anonymous"></script>
	<script src="../js/adminlte.js"></script>
</body>
</html>
