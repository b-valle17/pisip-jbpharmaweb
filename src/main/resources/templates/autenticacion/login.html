<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pisip-JBpharmaWeb | Iniciar Sesión</title>

<!-- Google Fonts -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" />
<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
<!-- AdminLTE CSS -->
<link rel="stylesheet" href="../css/adminlte.css" />

<!-- ESTILOS PERSONALIZADOS PARA EL LOGIN -->
<style>
body.login-page {
	background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
}

.login-box {
	width: 100%;
	max-width: 420px;
	padding: 15px;
}

.login-logo a {
	font-size: 1.8rem;
	font-weight: 700;
	color: #1e293b;
	text-decoration: none;
	letter-spacing: -0.5px;
}

.login-logo span {
	color: #0d6efd;
}

.card-custom {
	border: none;
	border-radius: 1rem;
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
	background: #ffffff;
	overflow: hidden;
}

.card-body-custom {
	padding: 2.5rem 2rem;
}

.form-control {
	border-top-left-radius: 0.5rem;
	border-bottom-left-radius: 0.5rem;
	padding: 0.75rem 1rem;
	border-color: #dee2e6;
}

.form-control:focus {
	box-shadow: none;
	border-color: #0d6efd;
}

.input-group-text {
	border-top-right-radius: 0.5rem;
	border-bottom-right-radius: 0.5rem;
	background-color: #f8f9fa;
	color: #6c757d;
	border-color: #dee2e6;
	padding-left: 1rem;
	padding-right: 1rem;
}

.btn-primary-custom {
	border-radius: 0.5rem;
	padding: 0.75rem;
	font-weight: 600;
	font-size: 1rem;
	background-color: #0d6efd;
	border: none;
	transition: all 0.2s ease-in-out;
}

.btn-primary-custom:hover {
	background-color: #0b5ed7;
	transform: translateY(-1px);
	box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
}

.forgot-link {
	color: #6c757d;
	text-decoration: none;
	font-size: 0.9rem;
	transition: color 0.2s;
}

.forgot-link:hover {
	color: #0d6efd;
	text-decoration: underline;
}

.alert-custom {
	border-radius: 0.5rem;
	font-size: 0.9rem;
}
</style>
</head>

<body class="login-page">
	<main class="login-box">

		<!-- BRAND LOGO -->
		<div class="login-logo text-center mb-4">
			<a href="#"><span>Pisip</span>-JBpharmaWeb</a>
		</div>

		<!-- MAIN CARD -->
		<div class="card card-custom">
			<div class="card-body card-body-custom">

				<div class="text-center mb-4">
					<h5 class="fw-bold text-dark mb-1">¡Bienvenido de nuevo!</h5>
					<p class="text-muted small">Ingresa tus credenciales para
						acceder al sistema</p>
				</div>

				<!-- 🔻 ALERTAS THYMELEAF 🔻 -->
				<div th:if="${mensajeError}"
					class="alert alert-danger alert-dismissible fade show alert-custom mb-3"
					role="alert">
					<i class="bi bi-exclamation-triangle-fill me-2"></i> <span
						th:text="${mensajeError}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"
						aria-label="Close"></button>
				</div>

				<div th:if="${mensajeExito}"
					class="alert alert-success alert-dismissible fade show alert-custom mb-3"
					role="alert">
					<i class="bi bi-check-circle-fill me-2"></i> <span
						th:text="${mensajeExito}"></span>
					<button type="button" class="btn-close" data-bs-dismiss="alert"
						aria-label="Close"></button>
				</div>
				<!-- 🔺 FIN ALERTAS 🔺 -->

				<!-- FORMULARIO DE LOGIN -->
				<form th:action="@{/autenticacion/login}" method="post">

					<!-- Campo Correo -->
					<div class="mb-3">
						<label for="loginEmail"
							class="form-label small text-muted fw-semibold mb-1">Correo
							electrónico</label>
						<div class="input-group">
							<input id="loginEmail" type="email" class="form-control"
								placeholder="nombre@ejemplo.com" name="username" required /> <span
								class="input-group-text"><i class="bi bi-envelope"></i></span>
						</div>
					</div>

					<!-- Campo Contraseña -->
					<div class="mb-4">
						<label for="loginPassword"
							class="form-label small text-muted fw-semibold mb-1">Contraseña</label>
						<div class="input-group">
							<input id="loginPassword" type="password" class="form-control"
								placeholder="••••••••" name="password" required /> <span
								class="input-group-text"><i class="bi bi-lock-fill"></i></span>
						</div>
					</div>

					<!-- Botón de Envío (Ocupa el 100% del ancho) -->
					<div class="d-grid mb-3">
						<button type="submit" class="btn btn-primary btn-primary-custom">
							Iniciar Sesión <i class="bi bi-box-arrow-in-right ms-2"></i>
						</button>
					</div>

				</form>

				<!-- ENLACE DE RECUPERACIÓN -->
				<div class="text-center mt-4">
					<a th:href="@{/autenticacion/recuperacion}" class="forgot-link">
						<i class="bi bi-key me-1"></i> ¿Olvidaste tu contraseña?
					</a>
				</div>

			</div>
		</div>

	</main>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		crossorigin="anonymous"></script>
	<!-- AdminLTE JS -->
	<script src="../js/adminlte.js"></script>
</body>
</html>
