<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<title>Orden de Producción | JB Pharma</title>

<style>
.metric-card .icon {
	font-size: 2rem;
	opacity: .75;
}

.table-actions .btn {
	margin-right: .25rem;
}

.status-dot {
	width: .65rem;
	height: .65rem;
	display: inline-block;
	border-radius: 50%;
	margin-right: .35rem;
}

.page-help {
	font-size: .92rem;
}
</style>
</head>
<body>

	<div layout:fragment="contenidopaginas">
		<div class="app-content-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-sm-6">
						<h1 class="mb-0 fs-3">Registrar nueva Órden de Fabricación</h1>
					</div>
					<div class="col-sm-6">
						<ol class="breadcrumb float-sm-end">
							<li class="breadcrumb-item"><a th:href="@{/ordenproduccion}"
								href="./listaorden.html">Inicio</a></li>
							<li class="breadcrumb-item"><a th:href="@{/ordenproduccion}"
								href="./listarorden.html">OrdenDeFabricacion</a></li>
							<li class="breadcrumb-item active">RegistrarNuevaOrden</li>
						</ol>
					</div>
				</div>
			</div>
		</div>

		<div class="app-content">
			<div class="container-fluid">
				<div class="row">
					<div class="col-lg-8">
						<div class="card card-primary card-outline">
							<div class="card-header">
								<h3 class="card-title">Nueva Órden</h3>
							</div>
							<form th:action="@{/ordenproduccion/guardar}"
								th:object="${orden}" method="post">
								<div class="card-body">
									<div class="row g-3">
										
										<div class="col-md-6">
											<label class="form-label">Número de Lote</label> <input
												type="text" class="form-control" id="numeroLote"
												placeholder="Ej: LOT-121" required th:field="*{numeroLote}">
										</div>

										<div class="col-md-6">
											<label class="form-label">Plan Asociado</label> <select
												class="form-select" th:field="*{idPlan}" required>
												<option value="">Seleccione un Plan</option>
												<option th:each="indice : ${listaplan}"
													th:value="${indice.idPlan}" th:text="${indice.codigoPlan}"></option>
											</select>
										</div>

										<div class="col-md-6">
											<label class="form-label">Producto</label> <select
												class="form-select" th:field="*{idProducto}" required>
												<option value="">Seleccione un Producto</option>
												<option th:each="indice : ${listaproductos}"
													th:value="${indice.idProducto}"
													th:text="${indice.nombreProducto}"></option>
											</select>
										</div>

										<div class="col-md-6">
											<label class="form-label">Usuario Responsable</label> <select
												class="form-select" th:field="*{idUsuario}" required>
												<option value="">Seleccione un Usuario</option>
												<option th:each="indice : ${listausuarios}"
													th:value="${indice.idUsuario}" th:text="${indice.nombre}"></option>
											</select>
										</div>

										<div class="col-md-6">
											<label class="form-label">Tamaño de Lote (KG)</label> <input
												type="number" step="0.001" class="form-control"
												id="cantidadLote" min="1" placeholder="Ej: 50" required
												th:field="*{cantidadLote}">
										</div>

										<div class="col-md-6">
											<label class="form-label">Fecha Inicio</label> <input
												type="date" class="form-control" id="fechaInicio" required
												th:field="*{fechaInicio}">
										</div>

										<div class="col-md-6">
											<label class="form-label">Fecha Fin</label> <input
												type="date" class="form-control" id="fechaFin" required
												th:field="*{fechaFin}">
										</div>

										<div class="col-md-6">
											<label class="form-label">Estado de la Orden</label> <select
												class="form-select" th:field="*{estado}" required>
												<option value="">Seleccione</option>
												<option value="COMPLETADO">COMPLETADO</option>
												<option value="EN PROCESO">EN PROCESO</option>
												<option value="PLANIFICADO">PLANIFICADO</option>
												<option value="CONTROL DE CALIDAD">CONTROL DE CALIDAD</option>
												<option value="CANCELADO">CANCELADO</option>
											</select>
										</div>
									</div>
								</div>
								<div class="card-footer d-flex gap-2">
									<button class="btn btn-primary" type="submit">
										<i class="bi bi-save me-1"></i>Guardar y continuar
									</button>
									<a class="btn btn-outline-secondary"
										th:href="@{/ordenproduccion}" href="./listarorden.html">Cancelar</a>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
