<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
<title>Registrar Órden de Producción | JB Pharma</title>

<style>
.metric-card .icon {
	font-size: 2rem;
	opacity: .75;
}

.table-actions .btn {
	margin-right: .25rem;
}

.status-dot {
	width: .65rem;
	height: .65rem;
	display: inline-block;
	border-radius: 50%;
	margin-right: .35rem;
}

.page-help {
	font-size: .92rem;
}

/* Estilo para el borde superior rojo oscuro */
.card-custom-red {
	border-top: 3px solid #8b0000;
}
</style>
</head>
<body>
	<h3 layout:fragment="titulo">Nueva Órden de Producción</h3>

	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/ordenproduccion}">Inicio</a></li>
		<li class="breadcrumb-item"><a th:href="@{/ordenproduccion}">OrdenDeFabricacion</a></li>
		<li class="breadcrumb-item active">Nueva</li>
	</ol>

	<div layout:fragment="contenidopaginas">
		<form th:action="@{/ordenproduccion/guardar}" th:object="${orden}"
			method="post">
			<div class="card content-card card-custom-red">
				<div class="card-header">
					<h5 class="card-title mb-0">Nueva Órden de Fabricación</h5>
				</div>
				<div class="card-body">
					<div class="row g-3">

						<!-- Número de Lote (Generado Automáticamente) -->
						<div class="col-md-6">
							<label class="form-label fw-bold">Número de Lote</label> <input
								type="text" class="form-control" id="numeroLote"
								th:field="*{numeroLote}" readonly />
						</div>

						<!-- Plan Asociado -->
						<div class="col-md-6">
							<label class="form-label fw-bold">Plan Asociado</label> <select
								class="form-select" th:field="*{idPlan}" required>
								<option value="">Seleccione un Plan</option>
								<option th:each="indice : ${listaplan}"
									th:value="${indice.idPlan}" th:text="${indice.codigoPlan}"></option>
							</select>
						</div>

						<!-- Producto -->
						<div class="col-md-6">
							<label class="form-label fw-bold">Producto</label> <select
								class="form-select" th:field="*{idProducto}" required>
								<option value="">Seleccione un Producto</option>
								<option th:each="indice : ${listaproductos}"
									th:value="${indice.idProducto}"
									th:text="${indice.nombreProducto}"></option>
							</select>
						</div>

						<!-- Usuario Responsable (Automático con el Usuario Logueado) -->
						<div class="col-md-6">
							<label class="form-label fw-bold">Usuario Responsable</label>
							<!-- Input oculto para enviar el ID del usuario al backend -->
							<input type="hidden" th:field="*{idUsuario}" />
							<!-- Input visible de solo lectura -->
							<input type="text" class="form-control"
								th:value="${nombreUsuarioLogueado != null ? nombreUsuarioLogueado : session.nombreUsuario}"
								readonly />
						</div>

						<!-- Tamaño de Lote (KG) -->
						<div class="col-md-6">
							<label class="form-label fw-bold">Tamaño de Lote (KG)</label> <input
								type="number" step="0.001" class="form-control"
								id="cantidadLote" min="1" placeholder="Ej: 50" required
								th:field="*{cantidadLote}">
						</div>

						<!-- Fecha de Inicio (Automática LocalDateTime) -->
						<div class="col-md-6">
							<label class="form-label fw-bold">Fecha de Inicio</label> <input
								type="datetime-local" class="form-control"
								id="fechaInicioDisplay" disabled> <input type="hidden"
								id="fechaInicio" th:field="*{fechaInicio}">
						</div>

						<!-- Estado de la Orden (Bloqueado) -->
						<div class="col-md-6">
							<label class="form-label fw-bold">Estado de la Orden</label> <input
								type="hidden" th:field="*{estado}" /> <input type="text"
								class="form-control"
								th:value="${orden != null and orden.estado != null ? orden.estado : 'EN PROCESO'}"
								readonly />
						</div>

					</div>
				</div>
				<div class="card-footer d-flex justify-content-end gap-2">
					<a class="btn btn-outline-secondary" th:href="@{/ordenproduccion}">
						<i class="bi bi-x-circle me-1"></i>Cancelar
					</a>
					<button class="btn btn-primary" type="submit">
						<i class="bi bi-save me-1"></i>Guardar y continuar
					</button>
				</div>
			</div>
		</form>
	</div>

	<!-- Script de autogeneración de Fecha y Hora Actual -->
	<th:block layout:fragment="scripts">
		<script>
			document.addEventListener("DOMContentLoaded", function() {
				const fechaDisplay = document
						.getElementById("fechaInicioDisplay");
				const fechaHidden = document.getElementById("fechaInicio");

				if (fechaDisplay && fechaHidden) {
					const ahora = new Date();
					const desfase = ahora.getTimezoneOffset() * 60000;
					const fechaIso = new Date(ahora.getTime() - desfase)
							.toISOString().slice(0, 16);

					fechaDisplay.value = fechaIso;
					if (!fechaHidden.value) {
						fechaHidden.value = fechaIso;
					}
				}
			});
		</script>
	</th:block>
</body>
</html>
