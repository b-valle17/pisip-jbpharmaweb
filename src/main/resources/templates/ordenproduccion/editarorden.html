<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
<title>Editar Órden de Fabricación | JB Pharma</title>

<style>
.metric-card .icon {
	font-size: 2rem;
	opacity: .75;
}

.table-actions .btn {
	margin-right: .25rem;
}

.status-dot {
	width: .65rem;
	height: .65rem;
	display: inline-block;
	border-radius: 50%;
	margin-right: .35rem;
}

.page-help {
	font-size: .92rem;
}
</style>
</head>
<body>

	<div layout:fragment="contenidopaginas">
		<div class="app-content-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-sm-6">
						<h1 class="mb-0 fs-3">Editar Órden de Fabricación</h1>
					</div>
					<div class="col-sm-6">
						<ol class="breadcrumb float-sm-end">
							<li class="breadcrumb-item"><a href="./index.html">Inicio</a></li>
							<li class="breadcrumb-item"><a th:href="@{/ordenproduccion}">OrdenDeFabricacion</a></li>
							<li class="breadcrumb-item active">EditarOrden</li>
						</ol>
					</div>
				</div>
			</div>
		</div>

		<div class="app-content">
			<div class="container-fluid">
				<div class="row">
					<div class="col-lg-8">
						<div class="card card-warning card-outline">
							<div class="card-header">
								<h3 class="card-title">Modificar Órden #<span th:text="${orden.idOrden}"></span></h3>
							</div>
							
							<!-- Formulario de Actualización -->
							<form th:action="@{/ordenproduccion/actualizar}"
								th:object="${orden}" method="post">
								
								<!-- Campo Oculto ID Órden -->
								<input type="hidden" th:field="*{idOrden}" />

								<div class="card-body">
									<div class="row g-3">
										
										<!-- Número de Lote -->
										<div class="col-md-6">
											<label class="form-label">Número de Lote</label> 
											<input type="text" class="form-control" id="numeroLote"
												placeholder="Ej: LOT-121" required th:field="*{numeroLote}">
										</div>

										<!-- Plan Asociado -->
										<div class="col-md-6">
											<label class="form-label">Plan Asociado</label> 
											<select class="form-select" th:field="*{idPlan}" required>
												<option value="">Seleccione un Plan</option>
												<option th:each="indice : ${listaplan}"
													th:value="${indice.idPlan}" 
													th:text="${indice.codigoPlan}"
													th:selected="${indice.idPlan == orden.idPlan}"></option>
											</select>
										</div>

										<!-- Producto -->
										<div class="col-md-6">
											<label class="form-label">Producto</label> 
											<select class="form-select" th:field="*{idProducto}" required>
												<option value="">Seleccione un Producto</option>
												<option th:each="indice : ${listaproductos}"
													th:value="${indice.idProducto}" 
													th:text="${indice.nombreProducto}"
													th:selected="${indice.idProducto == orden.idProducto}"></option>
											</select>
										</div>

										<!-- Usuario Responsable -->
										<div class="col-md-6">
											<label class="form-label">Usuario Responsable</label> 
											<select class="form-select" th:field="*{idUsuario}" required>
												<option value="">Seleccione un Usuario</option>
												<option th:each="indice : ${listausuarios}"
													th:value="${indice.idUsuario}" 
													th:text="${indice.nombre}"
													th:selected="${indice.idUsuario == orden.idUsuario}"></option>
											</select>
										</div>

										<!-- Tamaño de Lote (KG) -->
										<div class="col-md-6">
											<label class="form-label">Tamaño de Lote (KG)</label> 
											<input type="number" step="0.001" class="form-control" id="cantidadLote" min="1"
												placeholder="3" required th:field="*{cantidadLote}">
										</div>

										<!-- Fecha Inicio -->
										<div class="col-md-6">
											<label class="form-label">Fecha Inicio</label> 
											<input type="date" class="form-control" id="fechaInicio" required
												th:field="*{fechaInicio}">
										</div>

										<!-- Fecha Fin -->
										<div class="col-md-6">
											<label class="form-label">Fecha Fin</label> 
											<input type="date" class="form-control" id="fechaFin" required
												th:field="*{fechaFin}">
										</div>

										<!-- Estado de la Orden -->
										<div class="col-md-6">
											<label class="form-label">Estado de la Orden</label> 
											<select class="form-select" th:field="*{estado}" required>
												<option value="">Seleccione</option>
												<option value="EN PROCESO">EN PROCESO</option>
												<option value="PLANIFICADO">PLANIFICADO</option>
												<option value="BORRADOR">BORRADOR</option>
												<option value="CANCELADO">CANCELADO</option>
											</select>
										</div>

									</div>
								</div>

								<div class="card-footer d-flex gap-2">
									<button class="btn btn-warning" type="submit">
										<i class="bi bi-arrow-repeat me-1"></i>Guardar cambios
									</button>
									<a class="btn btn-outline-secondary" th:href="@{/ordenproduccion}">Cancelar</a>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
