<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
<title>Editar Plan de Producción | JB Pharma</title>
</head>
<body>

	<div layout:fragment="contenidopaginas">
		<div class="app-content-header">
			<div class="container-fluid">
				<h1 class="mb-0 fs-3">Editar Plan de Producción</h1>
			</div>
		</div>

		<div class="app-content">
			<div class="container-fluid">
				<div class="row">
					<div class="col-lg-8">
						<div class="card card-warning card-outline">
							<div class="card-header">
								<h3 class="card-title">
									Modificar Plan #<span th:text="${plan.codigoPlan}"></span>
								</h3>
							</div>

							<!-- Formulario apuntando a actualizar/{id} -->
							<form th:action="@{/planproduccion/actualizar}"
								th:object="${plan}" method="post">
								<input type="hidden" th:field="*{idPlan}" />

								<!-- Campo Oculto con el ID del Plan -->
								<input type="hidden" th:field="*{idPlan}" />

								<div class="card-body">
									<div class="row g-3">

										<!-- Código del Plan -->
										<div class="col-md-6">
											<label class="form-label">Código del Plan</label> <input
												type="text" class="form-control" required
												th:field="*{codigoPlan}">
										</div>

										<!-- Usuario Responsable -->
										<div class="col-md-6">
											<label class="form-label">Usuario Responsable</label> <select
												class="form-select" th:field="*{idUsuario}" required>
												<option value="">Seleccione un Usuario</option>
												<option th:each="indice : ${listausuarios}"
													th:value="${indice.idUsuario}" th:text="${indice.nombre}"
													th:selected="${indice.idUsuario == plan.idUsuario}"></option>
											</select>
										</div>

										<!-- Año -->
										<div class="col-md-6">
											<label class="form-label">Año</label> <input type="number"
												class="form-control" required th:field="*{anio}">
										</div>

										<!-- Mes -->
										<div class="col-md-6">
											<label class="form-label">Mes</label> <input type="number"
												min="1" max="12" class="form-control" required
												th:field="*{mes}">
										</div>

										<!-- Fecha Emisión -->
										<div class="col-md-6">
											<label class="form-label">Fecha Emisión</label> <input
												type="date" class="form-control" required
												th:field="*{fechaEmision}">
										</div>

										<!-- Estado -->
										<div class="col-md-6">
											<label class="form-label">Estado</label> <select
												class="form-select" th:field="*{estado}" required>
												<option value="BORRADOR">BORRADOR</option>
												<option value="PLANIFICADO">PLANIFICADO</option>
												<option value="EN PROCESO">EN PROCESO</option>
												<option value="COMPLETADO">COMPLETADO</option>
												<option value="CANCELADO">CANCELADO</option>
											</select>
										</div>

										<!-- Descripción -->
										<div class="col-12">
											<label class="form-label">Descripción</label>
											<textarea class="form-control" rows="3"
												th:field="*{descripcion}"></textarea>
										</div>

									</div>
								</div>

								<div class="card-footer d-flex gap-2">
									<button class="btn btn-warning" type="submit">
										<i class="bi bi-arrow-repeat me-1"></i>Guardar Cambios
									</button>
									<a class="btn btn-outline-secondary"
										th:href="@{/planproduccion}">Cancelar</a>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
