<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
<meta charset="UTF-8">
<title>Indicadores KPI | JB Pharma</title>
<!-- Library Chart.js para gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
	.kpi-card {
		border: none;
		border-radius: 10px;
		transition: transform 0.2s ease, box-shadow 0.2s ease;
	}
	.kpi-card:hover {
		transform: translateY(-2px);
		box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1) !important;
	}
	.kpi-border-success { border-top: 4px solid #198754; }
	.kpi-border-info { border-top: 4px solid #0dcaf0; }
	.kpi-border-warning { border-top: 4px solid #ffc107; }
	
	.kpi-icon-bg {
		width: 48px;
		height: 48px;
		border-radius: 50%;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 1.4rem;
	}
</style>
</head>
<body>

	<h3 layout:fragment="titulo">Indicadores KPI</h3>

	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/indicadorKpi}">Inicio</a></li>
		<li class="breadcrumb-item active">Indicadores KPI</li>
	</ol>

	<!-- Contenido principal de la página -->
	<div layout:fragment="contenidopaginas">
		<div class="app-content">
			<div class="container-fluid" th:if="${resumen != null}">

				<!-- FILA 1: Tarjetas Principales de KPIs (3 Columnas) -->
				<div class="row g-3 mb-4">
					<!-- Card 1: Cumplimiento Plan -->
					<div class="col-lg-4 col-md-6">
						<div class="card kpi-card kpi-border-success shadow-sm h-100 p-2">
							<div class="card-body d-flex align-items-center justify-content-between">
								<div>
									<span class="text-muted fw-semibold text-uppercase fs-7 d-block mb-1">Cumplimiento Plan Mensual</span>
									<h2 class="fw-bold mb-0 text-dark" th:text="${resumen.cumplimientoPlanMensual} + '%'">0%</h2>
								</div>
								<div class="kpi-icon-bg bg-success-subtle text-success">
									<i class="bi bi-graph-up-arrow"></i>
								</div>
							</div>
						</div>
					</div>

					<!-- Card 2: Total Lotes -->
					<div class="col-lg-4 col-md-6">
						<div class="card kpi-card kpi-border-info shadow-sm h-100 p-2">
							<div class="card-body d-flex align-items-center justify-content-between">
								<div>
									<span class="text-muted fw-semibold text-uppercase fs-7 d-block mb-1">Total Lotes Producidos</span>
									<h2 class="fw-bold mb-0 text-dark" th:text="${resumen.totalLotesProducidos}">0</h2>
								</div>
								<div class="kpi-icon-bg bg-info-subtle text-info">
									<i class="bi bi-boxes"></i>
								</div>
							</div>
						</div>
					</div>

					<!-- Card 3: Lotes en Cuarentena -->
					<div class="col-lg-4 col-md-12">
						<div class="card kpi-card kpi-border-warning shadow-sm h-100 p-2">
							<div class="card-body d-flex align-items-center justify-content-between">
								<div>
									<span class="text-muted fw-semibold text-uppercase fs-7 d-block mb-1">Lotes en Cuarentena / Ensayo</span>
									<h2 class="fw-bold mb-0 text-dark" th:text="${resumen.lotesEnCuarentena}">0</h2>
								</div>
								<div class="kpi-icon-bg bg-warning-subtle text-warning">
									<i class="bi bi-hourglass-split"></i>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- FILA 2: Sección de Análisis Visual y Desglose -->
				<div class="row g-3">
					<!-- Gráfico de Dona -->
					<div class="col-lg-7">
						<div class="card border-0 shadow-sm rounded-3 h-100">
							<div class="card-header bg-transparent border-0 pt-3 px-3">
								<h5 class="card-title fw-bold text-dark mb-0">
									<i class="bi bi-pie-chart-fill me-2 text-primary"></i>Distribución de Lotes por Estado
								</h5>
							</div>
							<div class="card-body d-flex align-items-center justify-content-center p-3">
								<div style="position: relative; height: 240px; width: 100%;">
									<canvas id="graficoEstados"></canvas>
								</div>
							</div>
						</div>
					</div>

					<!-- Leyenda / Detalle Estadístico -->
					<div class="col-lg-5">
						<div class="card border-0 shadow-sm rounded-3 h-100">
							<div class="card-header bg-transparent border-0 pt-3 px-3">
								<h5 class="card-title fw-bold text-dark mb-0">
									<i class="bi bi-list-check me-2 text-primary"></i>Resumen por Estado
								</h5>
							</div>
							<div class="card-body p-3">
								<div class="list-group list-group-flush">
									<div th:each="entry : ${resumen.distribucionPorEstado}" class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 py-2">
										<span class="fw-medium text-secondary" th:text="${entry.key}">ESTADO</span>
										<span class="badge bg-primary-subtle text-primary fw-bold rounded-pill px-3 py-2" th:text="${entry.value}">0</span>
									</div>
									<div th:if="${resumen.distribucionPorEstado == null or resumen.distribucionPorEstado.isEmpty()}" class="text-center text-muted py-4">
										Sin información registrada.
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- Script para Renderizar el Gráfico (Doughnut) -->
	<th:block layout:fragment="scripts">
		<script th:inline="javascript">
			document.addEventListener('DOMContentLoaded', () => {
				const ctx = document.getElementById('graficoEstados');
				if (!ctx) return;

				/*[[${resumen != null and resumen.distribucionPorEstado != null}]]*/
				const distribucionMap = /*[[${resumen?.distribucionPorEstado}]]*/ {};

				const labels = Object.keys(distribucionMap);
				const dataValues = Object.values(distribucionMap);

				const colorPalette = {
					'COMPLETADO': '#198754',
					'EN PROCESO': '#ffc107',
					'PLANIFICADO': '#0dcaf0',
					'CONTROL DE CALIDAD': '#0d6efd',
					'CANCELADO': '#dc3545'
				};

				const bgColors = labels.map(label => colorPalette[label] || '#6c757d');

				new Chart(ctx, {
					type: 'doughnut',
					data: {
						labels: labels,
						datasets: [{
							data: dataValues,
							backgroundColor: bgColors,
							borderWidth: 2,
							borderColor: '#ffffff'
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						cutout: '65%',
						plugins: {
							legend: {
								position: 'bottom',
								labels: {
									usePointStyle: true,
									padding: 15,
									font: { size: 12 }
								}
							},
							tooltip: {
								callbacks: {
									label: function(context) {
										return ` ${context.label}: ${context.raw} lote(s)`;
									}
								}
							}
						}
					}
				});
			});
		</script>
	</th:block>
</body>
</html>
