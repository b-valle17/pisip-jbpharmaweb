<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<div layout:fragment="contenidopaginas">
			<div class="app-content-header">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-6">
							<h1 class="mb-0 fs-3">Crear Producto</h1>
						</div>
					</div>
				</div>
			</div>
			<div class="app-content">
				<div class="container-fluid">
					<div class="row g-4">
						<div class="col-12">
							<div class="callout callout-info">En este formulario podrá
								crear el producto</div>
						</div>

						<div class="col-md-6 mx-auto">
							<!-- Alerta de error por duplicidad -->
							<div th:if="${error}"
								class="alert alert-danger alert-dismissible fade show"
								role="alert">
								<i class="bi bi-exclamation-triangle-fill me-2"></i> <span
									th:text="${error}"></span>
								<button type="button" class="btn-close" data-bs-dismiss="alert"
									aria-label="Close"></button>
							</div>

							<div class="card card-primary card-outline mb-4">
								<form th:action="@{/producto/guardar}" th:object="${producto}"
									method="post">
									<div class="card-body">
										<div class="mb-3">
											<label for="nombreProducto" class="form-label">Nombre
												producto</label> <input type="text" class="form-control"
												id="nombreProducto" th:field="*{nombreProducto}"
												pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
												title="Solo se permiten letras y espacios" minlength="3"
												maxlength="100" required />
											<div id="nombreHelp" class="form-text">En este campo
												debe escribir el nombre del producto</div>
										</div>
										<div class="mb-3">
											<label for="descripcion" class="form-label">Descripción
												del producto</label> <input type="text" class="form-control"
												id="descripcion" aria-describedby="limiteminimoHelp"
												th:field="*{descripcion}" required />
											<div id="limiteminimoHelp" class="form-text">En este
												campo debe escribir la descripción del producto</div>
										</div>
									</div>
									<div class="card-footer">
										<button type="submit" class="btn btn-primary">Guardar</button>
										<a th:href="@{/producto}" class="btn btn-secondary ms-2">Cancelar</a>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<footer class="app-footer">
			<div class="float-end d-none d-sm-inline">Anything you want</div>
			<strong> Copyright &copy; 2014-2026&nbsp; <a
				href="https://adminlte.io" class="text-decoration-none">AdminLTE.io</a>.
			</strong> All rights reserved.
		</footer>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		crossorigin="anonymous"></script>
	<script src="../js/adminlte.js"></script>
	<script>
		document.getElementById("nombreProducto").addEventListener(
				"input",
				function() {
					this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g,
							"");
				});
	</script>
</body>
</html>
