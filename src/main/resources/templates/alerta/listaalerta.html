<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{plantilla/plantillaui}">
<head><meta charset="UTF-8"><title>Alertas de ensayo</title></head><body>
<h3 layout:fragment="titulo">Alertas de ensayo</h3>
<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end"><li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li><li class="breadcrumb-item active">Alertas de ensayo</li></ol>
<div layout:fragment="contenidopaginas"><div class="card"><div class="card-header d-flex align-items-center"><h5 class="mb-0">Alertas registradas</h5><a th:href="@{/alertas/nuevo}" class="btn btn-primary btn-sm ms-auto">Nueva alerta</a></div><div class="card-body"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><input id="buscador" class="form-control mb-3" placeholder="Buscar"><div class="table-responsive"><table id="tabla" class="table table-hover align-middle"><thead><tr><th>Validación</th><th>Tipo</th><th>Destinatario</th><th>Asunto</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody><tr class="fila" th:each="a : ${alertas}"><td th:text="${a.idValidacion}"></td><td th:text="${a.tipoAlerta}"></td><td th:text="${a.destinatario}"></td><td th:text="${a.asunto}"></td><td><span class="badge" th:classappend="${a.estadoEnvio == 'ENVIADO'} ? ' text-bg-success' : (${a.estadoEnvio == 'ERROR'} ? ' text-bg-danger' : ' text-bg-warning')" th:text="${a.estadoEnvio}"></span></td><td th:text="${a.fechaGeneracion}"></td><td><form th:if="${a.tipoAlerta == 'EMAIL'}" th:action="@{/alertas/{id}/enviar(id=${a.idAlerta})}" method="post" class="d-inline"><button class="btn btn-sm btn-outline-success" title="Enviar correo"><i class="bi bi-envelope"></i></button></form> <a th:href="@{/alertas/{id}/editar(id=${a.idAlerta})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a><form th:action="@{/alertas/{id}/eliminar(id=${a.idAlerta})}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar este registro?')"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${alertas == null or #lists.isEmpty(alertas)}"><td colspan="7" class="text-center text-muted">No existen alertas.</td></tr></tbody></table></div></div></div></div>
<th:block layout:fragment="scripts"><script>document.addEventListener('DOMContentLoaded',function(){const b=document.getElementById('buscador');if(!b)return;b.addEventListener('input',function(){const q=b.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');document.querySelectorAll('#tabla .fila').forEach(function(f){const t=f.innerText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');f.style.display=t.includes(q)?'':'none';});});});</script></th:block></body></html>
