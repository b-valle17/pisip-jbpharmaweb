<!doctype html>
<html lang="es"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
	<meta charset="UTF-8">
	<title>Nuevo ensayo</title>
</head>
<body>
	<h3 layout:fragment="titulo">Nuevo ensayo</h3>

	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
		<li class="breadcrumb-item"><a th:href="@{/ensayos}">Ensayos</a></li>
		<li class="breadcrumb-item active">Nuevo</li>
	</ol>

	<div layout:fragment="contenidopaginas">
		<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
		<form th:action="@{/ensayos/guardar}"
			th:object="${ensayo}"
			method="post">

			<div class="card content-card">
				<div class="card-header">
					<h5 class="card-title mb-0">Registrar ensayo</h5>
				</div>

				<div class="card-body">
					<div class="row g-3">

						<div class="col-md-4">
							<label for="idOrden" class="form-label">Orden</label>
							<select id="idOrden"
								class="form-select"
								th:field="*{idOrden}"
								required>
								<option value="">Seleccione una orden</option>
								<option th:each="orden : ${ordenes}"
									th:value="${orden.idOrden}"
                                    th:attr="data-producto=${orden.idProducto}"
									th:text="${orden.numeroLote != null
										? orden.numeroLote + ' (ID ' + orden.idOrden + ')'
										: 'Orden ' + orden.idOrden}">
								</option>
							</select>
						</div>

						<div class="col-md-4">
							<label for="idProducto" class="form-label">Producto</label>
							<select id="idProducto"
								class="form-select"
								th:field="*{idProducto}"
								required>
								<option value="">Seleccione un producto</option>
								<option th:each="producto : ${productos}"
									th:value="${producto.idProducto}"
									th:text="${producto.nombreProducto != null
										? producto.nombreProducto
										: 'Producto ' + producto.idProducto}">
								</option>
							</select>
						</div>

						<div class="col-md-4">
							<label class="form-label">Código</label>
							<input type="text"
								class="form-control"
								value="Se generará automáticamente al guardar"
								disabled>
						</div>

						<div class="col-md-4">
							<label for="fechaEnsayo" class="form-label">Fecha</label>
							<input type="datetime-local"
								id="fechaEnsayo"
								class="form-control"
								th:field="*{fechaEnsayo}"
								required>
						</div>

						<div class="col-md-5">
							<label for="responsable" class="form-label">Responsable</label>
							<input type="text"
								id="responsable"
								class="form-control"
								th:field="*{responsable}"
								placeholder="Nombre del responsable"
								maxlength="100"
								required>
						</div>

						<div class="col-md-3">
							<label for="estado" class="form-label">Estado</label>
							<select id="estado"
								class="form-select"
								th:field="*{estado}"
								required>
								<option value="">Seleccione</option>
								<option value="REGISTRADO">REGISTRADO</option>
								<option value="EN_PROCESO">EN_PROCESO</option>
								<option value="EN_REVISION">EN_REVISION</option>
								<option value="COMPLETADO">COMPLETADO</option>
								<option value="FINALIZADO">FINALIZADO</option>
								<option value="OBSERVADO">OBSERVADO</option>
								<option value="PENDIENTE">PENDIENTE</option>
								<option value="RECHAZADO">RECHAZADO</option>
							</select>
						</div>

						<div class="col-12">
							<label for="observacion" class="form-label">Observación</label>
							<textarea id="observacion"
								class="form-control"
								rows="4"
								th:field="*{observacion}"
								placeholder="Ingrese una observación"
								maxlength="500"></textarea>
						</div>
					</div>
				</div>

				<div class="card-footer d-flex justify-content-end gap-2">
					<a th:href="@{/ensayos}" class="btn btn-outline-secondary">
						<i class="bi bi-x-circle me-1"></i>Cancelar
					</a>
					<button type="submit" class="btn btn-primary">
						<i class="bi bi-save me-1"></i>Guardar ensayo
					</button>
				</div>
			</div>
		</form>
	</div>

	<th:block layout:fragment="scripts">
		<script>
			document.addEventListener("DOMContentLoaded", function () {
                const ordenSelect = document.getElementById("idOrden");
                const productoSelect = document.getElementById("idProducto");
                function sincronizarProducto() {
                    if (!ordenSelect || !productoSelect) return;
                    const opcion = ordenSelect.options[ordenSelect.selectedIndex];
                    const idProducto = opcion ? opcion.dataset.producto : null;
                    if (idProducto) {
                        productoSelect.value = idProducto;
                        productoSelect.dispatchEvent(new Event("change"));
                    }
                }
                if (ordenSelect) ordenSelect.addEventListener("change", sincronizarProducto);

				const fecha = document.getElementById("fechaEnsayo");
				if (fecha && !fecha.value) {
					const ahora = new Date();
					const desfase = ahora.getTimezoneOffset() * 60000;
					fecha.value = new Date(ahora.getTime() - desfase)
						.toISOString().slice(0, 16);
				}
			});
		</script>
	</th:block>
</body>
</html>
