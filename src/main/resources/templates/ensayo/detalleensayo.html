<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillauli}">
<head>
<title>Detalle del ensayo</title>
</head>
<body>
	<h3 layout:fragment="titulo">Detalle del ensayo</h3>
	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
		<li class="breadcrumb-item"><a th:href="@{/ensayos}">Ensayos</a></li>
		<li class="breadcrumb-item active">Detalle</li>
	</ol>
	<div layout:fragment="contenidopaginas">
		<div class="card content-card">
			<div class="card-header d-flex align-items-center">
				<h5 class="card-title mb-0">Información del ensayo</h5>
				<a
					th:href="@{/ensayos/{id}/editar(id=${ensayo != null ? ensayo.idEnsayo : 1})}"
					class="btn btn-primary btn-sm ms-auto"><i
					class="bi bi-pencil me-1"></i>Editar</a>
			</div>
			<div class="card-body">
				<div class="row g-4">
					<div class="col-md-4">
						<small class="text-secondary d-block">Código</small><strong
							th:text="${ensayo != null ? ensayo.codigoEnsayo : 'ENS-2026-001'}"></strong>
					</div>
					<div class="col-md-4">
						<small class="text-secondary d-block">Lote</small><strong
							th:text="${ensayo != null ? ensayo.idLote : 1001}"></strong>
					</div>
					<div class="col-md-4">
						<small class="text-secondary d-block">Producto</small><strong
							th:text="${ensayo != null ? ensayo.idProducto : 501}"></strong>
					</div>
					<div class="col-md-4">
						<small class="text-secondary d-block">Fecha</small><strong
							th:text="${ensayo != null ? ensayo.fechaEnsayo : '16/07/2026 08:30'}"></strong>
					</div>
					<div class="col-md-4">
						<small class="text-secondary d-block">Responsable</small><strong
							th:text="${ensayo != null ? ensayo.responsable : 'Ana Torres'}"></strong>
					</div>
					<div class="col-md-4">
						<small class="text-secondary d-block">Estado</small><span
							class="badge text-bg-warning"
							th:text="${ensayo != null ? ensayo.estado : 'EN_PROCESO'}"></span>
					</div>
				</div>
			</div>
			<div class="card-footer d-flex justify-content-between">
				<a th:href="@{/ensayos}" class="btn btn-outline-secondary">Volver</a>
				<a
					th:href="@{/ensayos/{id}/variables(id=${ensayo != null ? ensayo.idEnsayo : 1})}"
					class="btn btn-success">Gestionar variables</a>
			</div>
		</div>
	</div>
	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
