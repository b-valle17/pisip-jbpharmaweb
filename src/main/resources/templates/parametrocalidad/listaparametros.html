
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<div layout:fragment="contenidopaginas">
			<div class="app-content-header">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-6">
							<h1 class="mb-0 fs-3">Lista Parametros</h1>
						</div>
						<div class="col-sm-6">
						</div>
					</div>
				</div>
			</div>
			<div class="app-content">
				<div class="container-fluid">
					<div class="card">
						<div class="card-header">
							<a th:href="@{/parametrocalidad/crearparametro}"
								class="btn btn-sm btn-outline-info" title="Crear Parametro"><i
								class="fa-solid fa-plus"></i> Crear Parametro </a>
							<div class="card-tools">
							</div>
						</div>
						<div class="card-body">
							<div id="users-table">
								<table class="table table-striped">
									<thead>
										<tr>
											<th scope="col">ID</th>
											<th scope="col">Nombre Parametro</th>
											<th scope="col">Limite Minimo</th>
											<th scope="col">Limite Maximo</th>
											<th scope="col">Unidad de Medida</th>
											<th scope="col">Fecha Configuracion</th>
											<th scope="col">Producto</th>
											<th scope="col">Acciones</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="indice : ${listaparametros}">
											<td th:text="${indice.idParametro}" class="fw-semibold"></td>
											<td th:text="${indice.nombreParametro}"></td>
											<td th:text="${indice.limiteMinimo}"></td>
											<td th:text="${indice.limiteMaximo}"></td>
											<td th:text="${indice.unidadMedida}"></td>
											<td
												th:text="${#dates.format(indice.fechaConfiguracion, 'dd/MM/yyyy')}"></td>
											<td>
												<!-- Buscamos el ID numérico dentro de nuestro mapa de roles -->
												<span th:if="${indice.idProducto != null}"
												th:text="${mapaProductos[indice.idProducto]}"
												class="badge bg-primary"></span> <span
												th:if="${indice.idProducto == null}"
												class="badge bg-secondary">Sin Producto</span>
											</td>
											<td>
												<div class="btn-group" role="group" aria-label="Acciones">
													<a
														th:href="@{/parametrocalidad/editarparametro(idParametro=${indice.idParametro})}"
														class="btn btn-sm btn-outline-warning" title="Editar">
														<i class="fa-solid fa-pen-to-square"></i>
													</a>
													<form
														th:action="@{/parametrocalidad/eliminar/{idParametro}(idParametro=${indice.idParametro})}"
														method="post" style="display: inline;"
														onsubmit="return confirm('¿Estás seguro de que deseas eliminar este parametro?');">
														<button type="submit"
															class="btn btn-sm btn-outline-danger">
															<i class="fa-solid fa-trash"></i>
														</button>
													</form>
												</div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
						<div class="card-footer text-secondary small">
							Powered by <a href="https://tabulator.info/" target="_blank"
								rel="noopener">Tabulator</a> &mdash; vanilla JS, no jQuery
							required.
						</div>
					</div>
				</div>
			</div>
		</div>
		<!--begin::Footer-->
		<footer class="app-footer">
			<!--begin::To the end-->
			<div class="float-end d-none d-sm-inline">Anything you want</div>
			<!--end::To the end-->
			<!--begin::Copyright-->
			<strong> Copyright &copy; 2014-2026&nbsp; <a
				href="https://adminlte.io" class="text-decoration-none">AdminLTE.io</a>.
			</strong> All rights reserved.
			<!--end::Copyright-->
		</footer>
		<!--end::Footer-->
	</div>
	<!--begin::Third Party Plugin(OverlayScrollbars)-->
	<script
		src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
		crossorigin="anonymous"></script>
	<!--end::Third Party Plugin(OverlayScrollbars)-->
	<!--begin::Required Plugin(popperjs for Bootstrap 5)-->
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		crossorigin="anonymous"></script>
	<!--end::Required Plugin(popperjs for Bootstrap 5)-->
	<!--begin::Required Plugin(Bootstrap 5)-->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		crossorigin="anonymous"></script>
	<!--end::Required Plugin(Bootstrap 5)-->
	<!--begin::Required Plugin(AdminLTE)-->
	<script src="../js/adminlte.js"></script>
	<!--end::Required Plugin(AdminLTE)-->
	<!--begin::OverlayScrollbars Configure-->
	<script>
      const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
      const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
      };
      document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

        // Disable OverlayScrollbars on mobile devices to prevent touch interference
        const isMobile = window.innerWidth <= 992;

        if (
          sidebarWrapper &&
          OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
          !isMobile
        ) {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
	<!--end::OverlayScrollbars Configure-->

     module (since 4.1) — no page script needed. Only the no-flash snippet

	<!--end::Color Mode Toggle-->
	<script
		src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.4.0/dist/js/tabulator.min.js"
		crossorigin="anonymous"></script>

		src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496"

		crossorigin="anonymous"></script>
</body>
</html>
