<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		
		<!-- Bloques vacíos para eliminar "JB Pharma" e "Inicio" superior -->
		<h3 layout:fragment="titulo" style="display: none;"></h3>
		<ol layout:fragment="breadcrumb" style="display: none;"></ol>

		<div layout:fragment="contenidopaginas">
			<div class="app-content-header">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-6">
							<h1 class="mb-0 fs-3">Historial de Lotes (Aceptados / Rechazados)</h1>
						</div>
						<div class="col-sm-6">
							<nav aria-label="breadcrumb">
								<ol class="breadcrumb float-sm-end">
									<li class="breadcrumb-item active" aria-current="page">Historial Lote</li>
								</ol>
							</nav>
						</div>
					</div>
				</div>
			</div>
			<div class="app-content">
				<div class="container-fluid">
					<div class="card">
						<div class="card-header">
							<!-- Filtro por estado -->
							<div class="btn-group btn-group-sm ms-3" role="group" aria-label="Filtro de estado">
								<a th:href="@{/historialLote}" class="btn"
									th:classappend="${estadoSeleccionado == null} ? 'btn-secondary' : 'btn-outline-secondary'">Todos</a>
								<a th:href="@{/historialLote(estado='ACEPTADO')}" class="btn"
									th:classappend="${estadoSeleccionado == 'ACEPTADO'} ? 'btn-success' : 'btn-outline-success'">Aceptados</a>
								<a th:href="@{/historialLote(estado='RECHAZADO')}" class="btn"
									th:classappend="${estadoSeleccionado == 'RECHAZADO'} ? 'btn-danger' : 'btn-outline-danger'">Rechazados</a>
							</div>

							<div class="card-tools">
								<div class="input-group input-group-sm" style="width: 18rem">
									<span class="input-group-text"> <i class="bi bi-search" aria-hidden="true"></i></span>
									<input id="buscadorHistorial" type="search" class="form-control"
										placeholder="Buscar por orden, accion, descripcion o estado" aria-label="Buscar" autocomplete="off" />
								</div>
							</div>
						</div>
						<div class="card-body">
							<div id="users-table">
								<table id="tablaHistorialLote" class="table table-striped">
									<thead>
										<tr>
											<th scope="col">ID</th>
											<th scope="col">Número de Lote</th>
											<th scope="col">Fecha Evento</th>
											<th scope="col">Acción</th>
											<th scope="col">Descripción</th>
											<th scope="col">Estado del Lote</th>
										</tr>
									</thead>
									<tbody>
										<tr class="fila-historial" th:each="indice : ${listahistoriallote}">
											<td th:text="${indice.idHistorial}" class="fw-semibold"></td>
											<td th:text="${mapaOrdenes[indice.idOrdenProduccion]} ?: 'Lote #' + ${indice.idOrdenProduccion}" class="fw-bold"></td>
											<td th:text="${indice.fechaEvento}"></td>
											<td th:text="${indice.accion}"></td>
											<td th:text="${indice.descripcion}"></td>
											<td>
												<span class="badge"
													th:classappend="${indice.accion == 'ACEPTACION'} ? 'text-bg-success' : (${indice.accion == 'RECHAZO'} ? 'text-bg-danger' : 'text-bg-secondary')"
													th:text="${indice.accion == 'ACEPTACION'} ? 'ACEPTADO' : (${indice.accion == 'RECHAZO'} ? 'RECHAZADO' : 'REGISTRO')">
												</span>
											</td>
										</tr>
										<tr id="sinResultadosHistorial" style="display: none">
											<td colspan="6" class="text-center text-muted py-4">No se encontraron registros con ese criterio.</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
						<div class="card-footer text-secondary small">
							Pisip-JBpharma &mdash; Historial Lote
						</div>
					</div>
				</div>
			</div>
			<footer class="app-footer"> </footer>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
		<script src="../js/adminlte.js"></script>
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const buscador = document.getElementById('buscadorHistorial');
				const filas = Array.from(document.querySelectorAll('#tablaHistorialLote .fila-historial'));
				const sinResultados = document.getElementById('sinResultadosHistorial');

				function normalizar(texto) {
					return (texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
				}

				if (buscador) {
					buscador.addEventListener('input', function () {
						const criterio = normalizar(buscador.value);
						let visibles = 0;
						filas.forEach(function (fila) {
							const coincide = normalizar(fila.innerText).includes(criterio);
							fila.style.display = coincide ? '' : 'none';
							if (coincide) visibles++;
						});
						if (sinResultados) {
							sinResultados.style.display = filas.length > 0 && visibles === 0 ? '' : 'none';
						}
					});
				}
			});
		</script>
	</div>
</body>
</html>
