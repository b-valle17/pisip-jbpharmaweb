<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillauli}">
<head>
<title>Editar variable</title>
</head>
<body>
	<h3 layout:fragment="titulo">Editar variable</h3>
	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
		<li class="breadcrumb-item"><a th:href="@{/variables}">Variables</a></li>
		<li class="breadcrumb-item active">Editar</li>
	</ol>
	<div layout:fragment="contenidopaginas">
		<form
			th:action="@{/variables/{id}/actualizar(id=${variable.idVariable})}"
			th:object="${variable}" method="post">
			<input type="hidden" th:field="*{idVariable}">
			<div class="card content-card">
				<div class="card-header">
					<h5 class="card-title mb-0">Actualizar variable</h5>
				</div>
				<div class="card-body">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label required">Ensayo</label><select
								class="form-select" th:field="*{idEnsayo}"><option
									value="">Seleccione...</option>
								<option value="1">ENS-2026-001</option>
								<option value="2">ENS-2026-002</option>
								<option value="3">ENS-2026-003</option></select>
						</div>
						<div class="col-md-6">
							<label class="form-label required">Nombre de variable</label><input
								class="form-control" th:field="*{nombreVariable}">
						</div>
						<div class="col-md-6">
							<label class="form-label required">Valor obtenido</label><input
								type="number" step="0.0001" class="form-control"
								th:field="*{valorObtenido}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Unidad de medida</label><input
								class="form-control" th:field="*{unidadMedida}">
						</div>
					</div>
				</div>
				<div class="card-footer text-end">
					<a th:href="@{/variables}" class="btn btn-outline-secondary">Cancelar</a>
					<button class="btn btn-primary">
						<i class="bi bi-save me-1"></i>Actualizar variable
					</button>
				</div>
			</div>
		</form>
	</div>
	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
