
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<div layout:fragment="contenidopaginas">
			<div class="app-content-header">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-6">
							<h1 class="mb-0 fs-3">Lista Informe Auditoría</h1>
						</div>
						<div class="col-sm-6">
							<nav aria-label="breadcrumb">
								<ol class="breadcrumb float-sm-end">
									<li class="breadcrumb-item"><a href="/index">Inicio</a></li>
									<li class="breadcrumb-item active" aria-current="page">Informe Auditoría</li>
								</ol>
							</nav>
						</div>
					</div>
				</div>
			</div>
			<div class="app-content">
				<div class="container-fluid">
					<div th:if="${success}"
						class="alert alert-success alert-dismissible fade show"
						role="alert">
						<span th:text="${success}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>
					<div th:if="${error}"
						class="alert alert-danger alert-dismissible fade show" role="alert">
						<span th:text="${error}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>

					<div class="card">
						<div class="card-header">
							<a th:if="${session.rolUsuario == 'SUPERVISOR'}"
								class="badge text-bg-info"
								th:href="@{/informeAuditoria/crearInformeAuditoria}"
								style="text-decoration: none;">Generar Informe Auditoría</a>
							<div class="card-tools">
								<div class="input-group input-group-sm" style="width: 16rem">
									<span class="input-group-text"> <i class="bi bi-search"
										aria-hidden="true"></i>
									</span> <input id="table-filter" type="search" class="form-control"
										placeholder="Filter rows&hellip;" aria-label="Filter rows" />
								</div>
							</div>
						</div>
						<div class="card-body">
							<div id="users-table">
								<table class="table table-striped">
									<thead>
										<tr>
											<th scope="col">ID</th>
											<th scope="col">ID Auditoría</th>
											<th scope="col">Fecha Generación</th>
											<th scope="col">Formato</th>
											<th scope="col">Ruta Archivo</th>
											<th scope="col">Comentario</th>
											<th scope="col" th:if="${session.rolUsuario == 'SUPERVISOR'}">Acciones</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="indice : ${listainformeauditoria}">
											<td th:text="${indice.idInforme}" class="fw-semibold"></td>
											<td th:text="${indice.idAuditoria}"></td>
											<td th:text="${indice.fechaGeneracion}"></td>
											<td th:text="${indice.formato}"></td>
											<td th:text="${indice.rutaArchivo}"></td>
											<td th:text="${indice.comentario != null and indice.comentario != '' ? indice.comentario : 'Sin comentarios'}"></td>
											<td th:if="${session.rolUsuario == 'SUPERVISOR'}">
												<button type="button" class="btn btn-sm btn-outline-primary"
													title="Comentar" data-bs-toggle="modal"
													data-bs-target="#modalComentar"
													th:data-id="${indice.idInforme}"
													onclick="prepararComentario(this)">
													<i class="bi bi-chat-left-text"></i>
												</button>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
						<div class="card-footer text-secondary small">
							Pisip-JBpharma &mdash; Informe Auditoría
						</div>
					</div>

					<div class="modal fade" id="modalComentar" tabindex="-1" aria-hidden="true"
						th:if="${session.rolUsuario == 'SUPERVISOR'}">
						<div class="modal-dialog">
							<form id="formComentar" method="post">
								<div class="modal-content">
									<div class="modal-header">
										<h5 class="modal-title">Comentar informe de auditoría</h5>
										<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
									</div>
									<div class="modal-body">
										<label for="comentario" class="form-label">Comentario</label>
										<textarea name="comentario" id="comentario" class="form-control" rows="3" required></textarea>
									</div>
									<div class="modal-footer">
										<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
										<button type="submit" class="btn btn-primary">Guardar comentario</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
	<!--begin::Footer-->
	<footer class="app-footer">
		<!--begin::To the end-->
		<div class="float-end d-none d-sm-inline">Anything you want</div>
		<!--end::To the end-->
		<!--begin::Copyright-->
		<strong> Copyright &copy; 2014-2026&nbsp; <a
			href="https://adminlte.io" class="text-decoration-none">AdminLTE.io</a>.
		</strong> All rights reserved.
		<!--end::Copyright-->
	</footer>
	<!--end::Footer-->
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		crossorigin="anonymous"></script>
	<script src="../js/adminlte.js"></script>
	<script>
		function prepararComentario(boton) {
			const id = boton.getAttribute('data-id');
			document.getElementById('formComentar').action = '/informeAuditoria/' + id + '/comentar';
		}
	</script>
	<script>
      const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
      const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
      };
      document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
        const isMobile = window.innerWidth <= 992;
        if (
          sidebarWrapper &&
          OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
          !isMobile
        ) {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
</body>
</html>
