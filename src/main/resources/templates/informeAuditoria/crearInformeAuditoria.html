
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="/plantilla/plantillaui">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<div layout:fragment="contenidopaginas">
			<div class="app-content-header">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-6">
							<h1 class="mb-0 fs-3">Crear Informe Auditoría</h1>
						</div>
						<div class="col-sm-6">
							<nav aria-label="breadcrumb">
								<ol class="breadcrumb float-sm-end">
									<li class="breadcrumb-item"><a href="/index">Inicio</a></li>
									<li class="breadcrumb-item"><a href="/informeAuditoria">Informe Auditoría</a></li>
									<li class="breadcrumb-item active" aria-current="page">Crear</li>
								</ol>
							</nav>
						</div>
					</div>
				</div>
			</div>
			<div class="app-content">
				<div class="container-fluid">
					<div class="row g-4">
						<div class="col-12">
							<div class="callout callout-info">En este formulario podra
								crear el informe de auditoría</div>
						</div>
						<div class="col-md-6 mx-auto">
							<div class="card card-primary card-outline mb-4">
								<form th:action="@{/informeAuditoria/guardar}" th:object="${informeAuditoria}"
									method="post">
									<div class="card-body">
										<div class="mb-3">
											<label for="idAuditoria" class="form-label">ID Auditoría</label>
											<input type="number" class="form-control" id="idAuditoria"
												th:field="*{idAuditoria}"/>
										</div>
										<div class="mb-3">
											<label for="fechaGeneracion" class="form-label">Fecha de Generación</label>
											<input type="date" class="form-control" id="fechaGeneracion"
												th:field="*{fechaGeneracion}"/>
										</div>
										<div class="mb-3">
											<label for="formato" class="form-label">Formato</label>
											<input type="text" class="form-control" id="formato"
												placeholder="Ej: PDF, EXCEL" th:field="*{formato}"/>
										</div>
										<div class="mb-3">
											<label for="rutaArchivo" class="form-label">Ruta del Archivo</label>
											<input type="text" class="form-control" id="rutaArchivo"
												th:field="*{rutaArchivo}"/>
										</div>
									</div>
									<div class="card-footer">
										<button type="submit" class="btn btn-primary">Guardar</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
	<!--begin::Footer-->
	<footer class="app-footer">
		<!--begin::To the end-->
		<div class="float-end d-none d-sm-inline">Anything you want</div>
		<!--end::To the end-->
		<!--begin::Copyright-->
		<strong> Copyright &copy; 2014-2026&nbsp; <a
			href="https://adminlte.io" class="text-decoration-none">AdminLTE.io</a>.
		</strong> All rights reserved.
		<!--end::Copyright-->
	</footer>
	<!--end::Footer-->
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
		crossorigin="anonymous"></script>
	<script src="../js/adminlte.js"></script>
	<script>
      const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
      const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
      };
      document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
        const isMobile = window.innerWidth <= 992;
        if (
          sidebarWrapper &&
          OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
          !isMobile
        ) {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
</body>
</html>
