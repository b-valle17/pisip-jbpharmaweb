<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillauli}">
<head>
<title>Parámetros de validación</title>
</head>
<body>
	<h3 layout:fragment="titulo">Parámetros de validación</h3>
	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
		<li class="breadcrumb-item active">Parámetros</li>
	</ol>
	<div layout:fragment="contenidopaginas">
		<div class="card content-card">
			<div class="card-header d-flex align-items-center">
				<h5 class="card-title mb-0">Rangos permitidos</h5>
				<a th:href="@{/parametrosvalidacion/nuevo}"
					class="btn btn-primary btn-sm ms-auto"><i
					class="bi bi-plus-circle me-1"></i>Nuevo parámetro</a>
			</div>
			<div class="card-body">
				<div class="example"
					th:if="${parametros == null or #lists.isEmpty(parametros)}">Se
					muestran 3 registros de ejemplo.</div>
				<div class="table-responsive">
					<table class="table table-hover align-middle">
						<thead>
							<tr>
								<th>Producto</th>
								<th>Variable</th>
								<th>Mínimo</th>
								<th>Máximo</th>
								<th>Unidad</th>
								<th>Activo</th>
								<th class="text-end">Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="p : ${parametros}">
								<td th:text="${p.idProducto}"></td>
								<td th:text="${p.nombreVariable}"></td>
								<td th:text="${p.valorMinimo}"></td>
								<td th:text="${p.valorMaximo}"></td>
								<td th:text="${p.unidadMedida}"></td>
								<td th:text="${p.activo ? 'Sí' : 'No'}"></td>
								<td class="text-end"><a
									th:href="@{/parametrosvalidacion/{id}/editar(id=${p.idParametro})}"
									class="btn btn-sm btn-outline-primary"><i
										class="bi bi-pencil"></i></a></td>
							</tr>
							<th:block
								th:if="${parametros == null or #lists.isEmpty(parametros)}">
								<tr>
									<td>501</td>
									<td>pH</td>
									<td>6.5000</td>
									<td>7.5000</td>
									<td>pH</td>
									<td><span class="badge text-bg-success">Sí</span></td>
									<td class="text-end"><a
										th:href="@{/parametrosvalidacion/1/editar}"
										class="btn btn-sm btn-outline-primary"><i
											class="bi bi-pencil"></i></a></td>
								</tr>
								<tr>
									<td>502</td>
									<td>Temperatura</td>
									<td>20.0000</td>
									<td>25.0000</td>
									<td>°C</td>
									<td><span class="badge text-bg-success">Sí</span></td>
									<td class="text-end"><a
										th:href="@{/parametrosvalidacion/2/editar}"
										class="btn btn-sm btn-outline-primary"><i
											class="bi bi-pencil"></i></a></td>
								</tr>
								<tr>
									<td>503</td>
									<td>Humedad</td>
									<td>40.0000</td>
									<td>60.0000</td>
									<td>%</td>
									<td><span class="badge text-bg-secondary">No</span></td>
									<td class="text-end"><a
										th:href="@{/parametrosvalidacion/3/editar}"
										class="btn btn-sm btn-outline-primary"><i
											class="bi bi-pencil"></i></a></td>
								</tr>
							</th:block>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
