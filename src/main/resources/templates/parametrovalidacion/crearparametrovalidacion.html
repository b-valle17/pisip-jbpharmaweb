<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillauli}">
<head>
<title>Nuevo parámetro</title>
</head>
<body>
	<h3 layout:fragment="titulo">Nuevo parámetro</h3>
	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
		<li class="breadcrumb-item"><a th:href="@{/parametrosvalidacion}">Parámetros</a></li>
		<li class="breadcrumb-item active">Nuevo</li>
	</ol>
	<div layout:fragment="contenidopaginas">
		<form th:action="@{/parametrosvalidacion/guardar}"
			th:object="${parametro}" method="post">
			<input type="hidden" th:field="*{idParametro}">
			<div class="card content-card">
				<div class="card-header">
					<h5 class="card-title mb-0">Registrar parámetro</h5>
				</div>
				<div class="card-body">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label required">Producto</label><input
								class="form-control" th:field="*{idProducto}">
						</div>
						<div class="col-md-6">
							<label class="form-label required">Variable</label><input
								class="form-control" th:field="*{nombreVariable}">
						</div>
						<div class="col-md-4">
							<label class="form-label required">Mínimo</label><input
								type="number" step="0.0001" class="form-control"
								th:field="*{valorMinimo}">
						</div>
						<div class="col-md-4">
							<label class="form-label required">Máximo</label><input
								type="number" step="0.0001" class="form-control"
								th:field="*{valorMaximo}">
						</div>
						<div class="col-md-4">
							<label class="form-label">Unidad</label><input
								class="form-control" th:field="*{unidadMedida}">
						</div>
						<div class="col-12">
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox"
									th:field="*{activo}"><label class="form-check-label">Activo</label>
							</div>
						</div>
					</div>
				</div>
				<div class="card-footer text-end">
					<a th:href="@{/parametrosvalidacion}"
						class="btn btn-outline-secondary">Cancelar</a>
					<button class="btn btn-primary">
						<i class="bi bi-save me-1"></i>Guardar parámetro
					</button>
				</div>
			</div>
		</form>
	</div>
	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
