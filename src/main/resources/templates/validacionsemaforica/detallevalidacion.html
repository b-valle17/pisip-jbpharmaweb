<!doctype html>
<html lang="es"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
	<meta charset="UTF-8">
	<title>Validación semafórica</title>
</head>
<body>
	<h3 layout:fragment="titulo">Validación semafórica</h3>

	<ol layout:fragment="breadcrumb" class="breadcrumb float-sm-end">
		<li class="breadcrumb-item"><a th:href="@{/dashboard}">Inicio</a></li>
		<li class="breadcrumb-item"><a th:href="@{/validaciones}">Validaciones</a></li>
		<li class="breadcrumb-item active"
			th:text="${validacion.idValidacion != null ? 'Editar' : 'Nueva'}">
			Nueva
		</li>
	</ol>

	<div layout:fragment="contenidopaginas">
		<form th:action="${validacion.idValidacion != null}
				? @{/validaciones/{id}/actualizar(id=${validacion.idValidacion})}
				: @{/validaciones/guardar}"
			th:object="${validacion}"
			method="post">

			<input type="hidden"
				th:if="${validacion.idValidacion != null}"
				th:field="*{idValidacion}">

			<div class="card content-card">
				<div class="card-header">
					<h5 class="card-title mb-0"
						th:text="${validacion.idValidacion != null
							? 'Actualizar validación'
							: 'Registrar validación'}">
						Registrar validación
					</h5>
				</div>

				<div class="card-body">
					<div class="row g-3">

                        <div class="col-md-4">
                            <label for="idEnsayo" class="form-label">Ensayo de laboratorio</label>
                            <select id="idEnsayo" name="idEnsayo" class="form-select" required>
                                <option value="">Seleccione un ensayo</option>
                                <option th:each="ensayo : ${ensayos}"
                                    th:value="${ensayo.idEnsayo}"
                                    th:attr="data-producto=${ensayo.idProducto}"
                                    th:selected="${ensayoSeleccionado != null and ensayoSeleccionado == ensayo.idEnsayo}"
                                    th:text="${ensayo.codigoEnsayo + ' - ' + ensayo.responsable}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="idVariable" class="form-label">Variable relacionada</label>
                            <select id="idVariable" class="form-select" th:field="*{idVariable}" required>
                                <option value="">Seleccione primero un ensayo</option>
                                <option th:each="variable : ${variables}"
                                    th:value="${variable.idVariable}"
                                    th:attr="data-ensayo=${variable.idEnsayo},data-nombre=${variable.nombreVariable},data-unidad=${variable.unidadMedida}"
                                    th:text="${variable.nombreVariable + ' - ' + variable.valorObtenido + ' ' + variable.unidadMedida}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="idParametro" class="form-label">Parámetro correspondiente</label>
                            <select id="idParametro" class="form-select" th:field="*{idParametro}" required>
                                <option value="">Se seleccionará automáticamente</option>
                                <option th:each="parametro : ${parametros}"
                                    th:value="${parametro.idParametro}"
                                    th:attr="data-producto=${parametro.idProducto},data-nombre=${parametro.nombreParametro},data-unidad=${parametro.unidadMedida}"
                                    th:text="${parametro.nombreParametro + ' [' + parametro.limiteMinimo + ' - ' + parametro.limiteMaximo + '] ' + parametro.unidadMedida}">
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <div id="avisoParametro" class="alert alert-warning d-none mb-3">
                                <i class="bi bi-exclamation-triangle me-1"></i>
                                <span id="textoAvisoParametro"></span>
                            </div>
                            <div class="alert alert-info mb-0">
                                <i class="bi bi-info-circle me-1"></i>
                                El resultado, el mensaje y la fecha se calculan automáticamente. ÓPTIMO indica rango adecuado; PRECAUCIÓN, proximidad a un límite; CRÍTICO, valor fuera del rango permitido.
                            </div>
                        </div>
					</div>
				</div>

				<div class="card-footer text-end">
					<a th:href="@{/validaciones}" class="btn btn-outline-secondary">Cancelar</a>
					<button type="submit" class="btn btn-primary">
						<i class="bi bi-save me-1"></i>Guardar
					</button>
				</div>
			</div>
		</form>
	</div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const ensayo = document.getElementById("idEnsayo");
                const variable = document.getElementById("idVariable");
                const parametro = document.getElementById("idParametro");
                const botonGuardar = document.querySelector('button[type="submit"]');
                const aviso = document.getElementById("avisoParametro");
                const textoAviso = document.getElementById("textoAvisoParametro");

                function normalizar(texto) {
                    return (texto || "").trim().toLowerCase();
                }

                function mostrarAviso(mensaje) {
                    aviso.classList.toggle("d-none", !mensaje);
                    textoAviso.textContent = mensaje || "";
                    botonGuardar.disabled = Boolean(mensaje);
                }

                function parametrosCompatibles(idProducto, opcionVariable) {
                    const nombre = normalizar(opcionVariable?.dataset.nombre);
                    const unidad = normalizar(opcionVariable?.dataset.unidad);

                    return Array.from(parametro.options).filter(function (op, indice) {
                        if (indice === 0) return false;
                        const mismoProducto = op.dataset.producto === idProducto;
                        const mismoNombre = normalizar(op.dataset.nombre) === nombre;
                        const mismaUnidad = normalizar(op.dataset.unidad) === unidad;
                        return mismoProducto && mismoNombre && mismaUnidad;
                    });
                }

                function seleccionarParametro() {
                    const opcionEnsayo = ensayo.options[ensayo.selectedIndex];
                    const opcionVariable = variable.options[variable.selectedIndex];
                    const idProducto = opcionEnsayo?.dataset.producto || "";

                    Array.from(parametro.options).forEach(function (op, indice) {
                        if (indice === 0) return;
                        op.hidden = true;
                        op.disabled = true;
                    });

                    if (!opcionVariable || !opcionVariable.value) {
                        parametro.value = "";
                        mostrarAviso("Seleccione una variable registrada para el ensayo.");
                        return;
                    }

                    const compatibles = parametrosCompatibles(idProducto, opcionVariable);
                    if (compatibles.length === 1) {
                        compatibles[0].hidden = false;
                        compatibles[0].disabled = false;
                        parametro.value = compatibles[0].value;
                        mostrarAviso("");
                        return;
                    }

                    parametro.value = "";
                    const nombre = opcionVariable.dataset.nombre || "sin nombre";
                    const unidad = opcionVariable.dataset.unidad || "sin unidad";
                    mostrarAviso(
                        "La variable '" + nombre + "' (" + unidad + ") no coincide con ningún parámetro del producto. " +
                        "Elimine esa variable y regístrela con el nombre y la unidad configurados en Parámetros de calidad."
                    );
                }

                function filtrarVariables() {
                    const idEnsayo = ensayo.value;
                    let primera = "";

                    Array.from(variable.options).forEach(function (op, indice) {
                        if (indice === 0) return;
                        const visible = op.dataset.ensayo === idEnsayo;
                        op.hidden = !visible;
                        op.disabled = !visible;
                        if (visible && !primera) primera = op.value;
                    });

                    const actualValido = Array.from(variable.options).some(function (op) {
                        return op.value === variable.value && !op.disabled;
                    });
                    if (!actualValido) variable.value = primera;
                    seleccionarParametro();
                }

                ensayo.addEventListener("change", filtrarVariables);
                variable.addEventListener("change", seleccionarParametro);
                filtrarVariables();
            });
        </script>
    </th:block>
</body>
</html>
